# Supabase local development config.
# Project ID is set by the operator before running `supabase link`.
# This file is committed; secrets live in .env.local (gitignored).

project_id = "ai-thesis"

[api]
enabled = true
port = 54321
schemas = ["public", "storage", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 15

[db.pooler]
enabled = false
port = 54329
pool_mode = "transaction"
default_pool_size = 20
max_client_conn = 100

[studio]
enabled = true
port = 54323

[inbucket]
enabled = true
port = 54324

[storage]
enabled = true
file_size_limit = "50MiB"

[auth]
enabled = true
site_url = "http://localhost:3000"
additional_redirect_urls = ["https://localhost:3000"]
jwt_expiry = 3600
enable_signup = false
enable_anonymous_sign_ins = false

[auth.email]
enable_signup = false
double_confirm_changes = true
enable_confirmations = true

[analytics]
enabled = false

[edge_runtime]
enabled = true
inspector_port = 8083

# Ingestion functions are invoked by pg_cron with a Bearer secret, not a
# Supabase JWT. Disable the platform's JWT check so requireCronAuth() can do
# the verification inside the function. (Supabase's `verify_jwt` defaults to
# true and runs before the function code, so leaving it on would 401 the
# scheduled calls before our auth helper sees them.)
[functions.ingest-fundamentals]
verify_jwt = false

[functions.ingest-consensus]
verify_jwt = false

[functions.ingest-prices]
verify_jwt = false

[functions.compute-q-scores]
verify_jwt = false

[functions.compute-g-scores]
verify_jwt = false
